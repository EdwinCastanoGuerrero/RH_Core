services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rh_core_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - rh_core_network
    depends_on:
      - db
      - mailhog

  nginx:
    image: nginx:alpine
    container_name: rh_core_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - rh_core_network
    depends_on:
      - app

  mailhog:
    image: mailhog/mailhog
    container_name: rh_core_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - rh_core_network

  db:
    image: mysql:8.0
    container_name: rh_core_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - rh_core_network

networks:
  rh_core_network:
    driver: bridge

volumes:
  db_data:
